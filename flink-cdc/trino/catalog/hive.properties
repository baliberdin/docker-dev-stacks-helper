# Catalogo Hive do Trino - util para inspecionar/consultar tabelas Hive comuns
# sobre o mesmo metastore e o MinIO. Nao e obrigatorio para o CDC Iceberg,
# mas atende ao pedido de expor catalogos hive/iceberg.
connector.name=hive
hive.metastore.uri=thrift://hive-metastore:9083

fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minio
s3.aws-secret-key=minio123

hive.non-managed-table-writes-enabled=true
