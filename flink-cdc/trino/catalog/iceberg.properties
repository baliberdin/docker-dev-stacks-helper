# Catalogo Iceberg do Trino - le as tabelas Iceberg criadas pelo Flink CDC.
# Usa o mesmo Hive Metastore como catalogo Iceberg e o MinIO como storage.
connector.name=iceberg
iceberg.catalog.type=hive_metastore
hive.metastore.uri=thrift://hive-metastore:9083

# Acesso ao MinIO via S3 nativo do Trino
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minio
s3.aws-secret-key=minio123

# Retencao minima para expire_snapshots / remove_orphan_files, parametrizada por
# variavel de ambiente (Trino resolve ${ENV:VAR} em tempo de boot). O DEFAULT e
# seguro para producao (7 dias): protege snapshots/arquivos ainda em uso por
# leituras concorrentes. Para a demo de manutencao, sobreponha para "0s" (ver
# .env / ICEBERG_*_MIN_RETENTION), NUNCA em producao.
iceberg.expire-snapshots.min-retention=${ENV:ICEBERG_EXPIRE_SNAPSHOTS_MIN_RETENTION}
iceberg.remove-orphan-files.min-retention=${ENV:ICEBERG_REMOVE_ORPHAN_FILES_MIN_RETENTION}
