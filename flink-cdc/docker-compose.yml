name: flink-cdc-lakehouse

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL - banco de origem para o CDC (wal_level=logical)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: postgres
    hostname: postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # MinIO - armazenamento S3 para as tabelas Iceberg
  # ---------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    hostname: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lakehouse

  # Cria o bucket "warehouse" no MinIO na inicializacao
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio123;
      mc mb --ignore-existing local/warehouse;
      mc anonymous set public local/warehouse;
      echo 'Bucket warehouse pronto';
      exit 0;
      "
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # Hive Metastore - catalogo compartilhado entre Flink (escrita) e Trino (leitura)
  # Usa o Postgres como backend de metadados e MinIO como filesystem S3A
  # ---------------------------------------------------------------------------
  hive-metastore:
    build:
      context: ./hive-metastore
    container_name: hive-metastore
    hostname: hive-metastore
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "9083:9083"
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # Flink - cluster standalone (JobManager + TaskManager) com jars de CDC/Iceberg
  # ---------------------------------------------------------------------------
  flink-jobmanager:
    build:
      context: ./flink
    container_name: flink-jobmanager
    hostname: flink-jobmanager
    depends_on:
      hive-metastore:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 1
        execution.checkpointing.interval: 10s
        state.backend.type: hashmap
        rest.flamegraph.enabled: true
    volumes:
      - ./flink/pipelines:/opt/flink/pipelines:ro
      - flink-checkpoints:/tmp/flink-checkpoints
    networks:
      - lakehouse

  flink-taskmanager:
    build:
      context: ./flink
    container_name: flink-taskmanager
    hostname: flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    scale: 1
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 1
        execution.checkpointing.interval: 10s
        state.backend.type: hashmap
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # Kafka (KRaft, single-node) - broker para o Teste B (Debezium -> Kafka -> Iceberg)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.2
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # Kafka Connect - imagem Debezium (source Postgres + unwrap) com o Iceberg Sink
  # Connector instalado. Registra o catalogo Iceberg no MESMO Hive Metastore.
  # ---------------------------------------------------------------------------
  kafka-connect:
    build:
      context: ./kafka-connect
    container_name: kafka-connect
    hostname: kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      hive-metastore:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Converters default de worker (Avro via Schema Registry). Os connectors
      # tambem definem os converters explicitamente em suas configs.
      KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8085
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8085
      # Converters internos permanecem JSON (estado interno do Connect).
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # Schema Registry (Confluent) - registro de schemas Avro para o Teste B
  # ---------------------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.10
    container_name: schema-registry
    hostname: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8085
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/subjects >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # Redpanda Console (open-source) - UI para inspecionar topicos, schemas e
  # connectors do Kafka Connect. Aponta para o broker, o Schema Registry e o Connect.
  # ---------------------------------------------------------------------------
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.7.4
    container_name: redpanda-console
    hostname: redpanda-console
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
    ports:
      - "8090:8080"
    environment:
      # Configuracao via variavel YAML unica (config em bloco).
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers:
            - kafka:9092
        schemaRegistry:
          enabled: true
          urls:
            - http://schema-registry:8085
        kafkaConnect:
          enabled: true
          clusters:
            - name: kafka-connect
              url: http://kafka-connect:8083
    entrypoint: /bin/sh
    command: -c "echo \"$${CONSOLE_CONFIG_FILE}\" > /tmp/config.yml; exec /app/console"
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # Trino - engine de consulta com catalogos hive e iceberg sobre o metastore
  # ---------------------------------------------------------------------------
  trino:
    image: trinodb/trino:465
    container_name: trino
    hostname: trino
    depends_on:
      hive-metastore:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      # Retencao minima para as operacoes de manutencao Iceberg (expire_snapshots /
      # remove_orphan_files). Referenciadas em trino/catalog/iceberg.properties via
      # ${ENV:...}. DEFAULT seguro de producao = 7 dias. Para a demo de manutencao,
      # rode com ICEBERG_EXPIRE_SNAPSHOTS_MIN_RETENTION=0s (ex.: via .env), nunca em prod.
      ICEBERG_EXPIRE_SNAPSHOTS_MIN_RETENTION: ${ICEBERG_EXPIRE_SNAPSHOTS_MIN_RETENTION:-7d}
      ICEBERG_REMOVE_ORPHAN_FILES_MIN_RETENTION: ${ICEBERG_REMOVE_ORPHAN_FILES_MIN_RETENTION:-7d}
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    networks:
      - lakehouse

networks:
  lakehouse:
    # Nome explicito sem underscore. O Hive Metastore client rejeita hostnames
    # com "_" (URISyntaxException), e o DNS interno do compose usaria o nome do
    # projeto como sufixo. Fixando o nome da rede evitamos o underscore.
    name: lakehouse
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  flink-checkpoints:
